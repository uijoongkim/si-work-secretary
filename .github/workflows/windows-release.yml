name: Windows installer release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Prepare installer and checksum
        id: package
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          $installer = Get-ChildItem release -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found in release/" }
          $checksum = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $checksumPath = Join-Path $env:RUNNER_TEMP "SI-Work-Secretary-$($package.version).sha256"
          "$checksum  $($installer.Name)" | Set-Content -Path $checksumPath -Encoding ascii
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SI-Work-Secretary-Windows-Installer
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          INSTALLER: ${{ steps.package.outputs.installer }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          INSTALLER_NAME: ${{ steps.package.outputs.installer_name }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG "$env:INSTALLER" "$env:CHECKSUM" --clobber
          } else {
            gh release create $env:RELEASE_TAG "$env:INSTALLER" "$env:CHECKSUM" --target "$env:GITHUB_SHA" --title "SI Work Secretary $env:RELEASE_TAG" --notes "Windows per-user installer for internal evaluation. SHA-256 checksum is attached. This build is unsigned; Windows may show an unknown publisher warning."
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release upload failed." }
